# kind cluster config that can actually serve Ingress.
#
# The cluster this project was first built on was created with a bare
# `kind create cluster --name argocd`, which maps ONLY the API server port to
# the host:
#
#   $ docker port argocd-control-plane
#   6443/tcp -> 127.0.0.1:53796
#
# With no host mapping for 80/443, an ingress controller inside the cluster is
# unreachable from macOS no matter how it is configured. Docker cannot add port
# mappings to a running container, so this is fixed only by recreating the
# cluster with the config below.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # ingress-nginx's nodeSelector targets this label, which is the
      # conventional way to pin the controller to a node that has the host
      # ports mapped.
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
