# Wave 0 — ingress-nginx, one front door for ArgoCD and LiteLLM.
#
# Configured to work on BOTH cluster shapes:
#
#   * A cluster created from kind-config.yaml (host ports 80/443 mapped):
#     hostPort binding makes http://argocd.localtest.me work directly.
#
#   * The original cluster (no host port mapping): the hostPort binding is
#     harmless but unreachable from macOS, so reach the controller with
#     `make ingress` instead, which port-forwards it to localhost:8080.
#
# Deliberately NOT pinned with `nodeSelector: ingress-ready=true`. That label
# only exists on a cluster built from kind-config.yaml; requiring it would leave
# the controller Pending forever on the current one. On a single-node kind
# cluster there is nowhere else to schedule anyway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          replicaCount: 1
          # Bind 80/443 directly on the node. With kind extraPortMappings that
          # is what makes the Ingress reachable from the host.
          hostPort:
            enabled: true
            ports:
              http: 80
              https: 443
          # A hostPort is exclusive per node, and this cluster has one node. With
          # the chart's default maxSurge of 25% the replacement pod is created
          # before the old one is retired, so it sits Pending forever waiting
          # for a port the old pod will not release until the new one is Ready:
          #   0/1 nodes are available: 1 node(s) didn't have free ports
          #
          # maxSurge: 0 inverts that — the old pod goes first, then the new one
          # takes the port. Costs a second of downtime per change.
          #
          # Note this keeps type: RollingUpdate rather than switching to
          # Recreate. Recreate looks like the natural fix but the API server
          # rejects it outright under server-side apply, because SSA keeps the
          # defaulted rollingUpdate block that kube-controller-manager owns:
          #
          #   Deployment.apps "ingress-nginx-controller" is invalid:
          #   spec.strategy.rollingUpdate: Forbidden: may not be specified
          #   when strategy `type` is 'Recreate'
          #
          # maxSurge: 0 needs no field removal, so it applies cleanly.
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          # NodePort rather than the chart's default LoadBalancer: kind has no
          # cloud provider, so a LoadBalancer Service would sit <pending> and
          # the Application would never report Healthy.
          service:
            type: NodePort
          # By default the controller copies its Service's loadBalancer status
          # into every Ingress's status field. A NodePort Service has no
          # loadBalancer status, so every Ingress would keep an empty ADDRESS —
          # and ArgoCD reports an Ingress with no address as Progressing
          # forever, which would leave ingress-routes permanently un-Healthy.
          # Publishing node IPs instead gives each Ingress a real address.
          publishService:
            enabled: false
          reportNodeInternalIp: true
          # argocd-server runs with server.insecure=true and serves plain HTTP,
          # so nothing here should try to redirect to HTTPS.
          config:
            ssl-redirect: "false"
          watchIngressWithoutClass: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: "1", memory: 256Mi }
          admissionWebhooks:
            enabled: true
            patch:
              resources:
                requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
