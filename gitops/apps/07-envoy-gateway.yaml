# Wave 1 — Envoy Gateway, the data plane Agent Router builds on.
#
# v1.8.1 is the floor: Agent Router v1.1 requires Envoy Gateway 1.8.1+.
#
# This chart also OWNS the Gateway API CRDs. It ships bundle v1.5.1 on the
# experimental channel in its crds/ directory, which is exactly the Gateway API
# 1.5 that Agent Router v1.1 requires — so there is no separate CRD Application
# here, and there must not be one.
#
# An earlier revision did add one, installing the standard channel. The two
# Applications then fought over the same objects and neither could reach Synced:
#
#   gateway.networking.k8s.io/channel: standard   (the separate app)
#   gateway.networking.k8s.io/channel: experimental (this chart)
#   argocd.argoproj.io/tracking-id: gateway-api-crds:...  vs  envoy-gateway:...
#
# That mistake came from checking `helm template gateway-helm | grep` for the
# CRDs and finding none — `helm template` omits a chart's crds/ directory unless
# --include-crds is passed, while ArgoCD always applies it. To inspect what
# ArgoCD will actually install, always use:
#
#   helm template <chart> --include-crds
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.8.1
    helm:
      releaseName: envoy-gateway
      values: |
        config:
          envoyGateway:
            extensionApis:
              # The Backend API (gateway.envoyproxy.io/v1alpha1 Backend) is
              # opt-in. Agent Router's AIServiceBackend points at a Backend to
              # reach an arbitrary upstream, so without this every route is
              # answered with a 500 and the controller logs:
              #
              #   setting 500 direct response in routes due to errors in
              #   processing destinations
              #   error: "Backend is disabled in Envoy Gateway configuration"
              enableBackend: true
            # THE piece that makes Agent Router actually route.
            #
            # The AI Gateway controller runs an Envoy Gateway "extension server"
            # on grpc/1063. Envoy Gateway calls it during xDS translation, and
            # that is what injects the ext_proc filter which reads `model` from
            # the request body and sets the x-ai-eg-model header the
            # AIGatewayRoute matches on.
            #
            # Without this block everything looks healthy — Gateway Programmed,
            # AIGatewayRoute/AIServiceBackend/Backend all Accepted, HTTPRoute
            # generated, ext_proc sidecar injected and ready — and every request
            # still falls through to the catch-all rule:
            #
            #   "No matching route found. It is likely because the model
            #    specified in your request is not configured in the Gateway."
            #
            # because nothing ever sets the header. Sending
            # `x-ai-eg-model: qwen3` by hand routes correctly, which is how this
            # was isolated.
            extensionManager:
              hooks:
                xdsTranslator:
                  translation:
                    listener:
                      includeAll: true
                    route:
                      includeAll: true
                    cluster:
                      includeAll: true
                    secret:
                      includeAll: true
                  post:
                    - Translation
                    - Cluster
                    - Route
                    - HTTPListener
              service:
                fqdn:
                  hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
                  port: 1063
        deployment:
          replicas: 1
          envoyGateway:
            # Chart default is 256Mi request / 1Gi limit. Trimmed for a node
            # that already runs two models, Postgres and the rest of the
            # platform — but not removed: a pod with no requests is BestEffort
            # and is the first thing the kubelet kills under pressure.
            resources:
              requests: { cpu: 50m, memory: 192Mi }
              limits:   { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
