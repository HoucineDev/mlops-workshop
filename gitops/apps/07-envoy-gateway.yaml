# Wave 1 — Envoy Gateway, the data plane Agent Router builds on.
#
# v1.8.1 is the floor: Agent Router v1.1 requires Envoy Gateway 1.8.1+.
#
# This chart also OWNS the Gateway API CRDs. It ships bundle v1.5.1 on the
# experimental channel in its crds/ directory, which is exactly the Gateway API
# 1.5 that Agent Router v1.1 requires — so there is no separate CRD Application
# here, and there must not be one.
#
# An earlier revision did add one, installing the standard channel. The two
# Applications then fought over the same objects and neither could reach Synced:
#
#   gateway.networking.k8s.io/channel: standard   (the separate app)
#   gateway.networking.k8s.io/channel: experimental (this chart)
#   argocd.argoproj.io/tracking-id: gateway-api-crds:...  vs  envoy-gateway:...
#
# That mistake came from checking `helm template gateway-helm | grep` for the
# CRDs and finding none — `helm template` omits a chart's crds/ directory unless
# --include-crds is passed, while ArgoCD always applies it. To inspect what
# ArgoCD will actually install, always use:
#
#   helm template <chart> --include-crds
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.8.1
    helm:
      releaseName: envoy-gateway
      values: |
        deployment:
          replicas: 1
          envoyGateway:
            # Chart default is 256Mi request / 1Gi limit. Trimmed for a node
            # that already runs two models, Postgres and the rest of the
            # platform — but not removed: a pod with no requests is BestEffort
            # and is the first thing the kubelet kills under pressure.
            resources:
              requests: { cpu: 50m, memory: 192Mi }
              limits:   { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
