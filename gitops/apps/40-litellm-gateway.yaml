# Wave 4 — the LiteLLM gateway.
#
# Last, because its readiness probe checks the configured upstreams: starting it
# before the predictor exists just means a few minutes of failing probes.
#
# The chart's kserve.inferenceServices list is what wires the two together. It
# renders api_base as
#   http://tiny-llm-predictor.models.svc.cluster.local/v1
# which is exactly the Service KServe creates for the InferenceService in wave 3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: https://github.com/HoucineDev/mlops-workshop.git
    targetRevision: main
    path: charts/litellm-gateway
    helm:
      releaseName: litellm-gateway
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  # The API server rewrites volumeClaimTemplates on admission — it adds
  # apiVersion, kind, volumeMode and a status block ({"phase":"Pending"}) — so
  # the stored object never matches what Helm rendered. Every sync applied
  # cleanly ("serverside-applied") and the StatefulSet went straight back to
  # OutOfSync, which stalled the root app's wave ordering.
  #
  # Ignoring the whole block rather than picking off individual fields, because
  # volumeClaimTemplates is IMMUTABLE after creation: ArgoCD could not act on a
  # diff there even if it found a real one. Changing a volume claim means
  # recreating the StatefulSet by hand:
  #   kubectl delete statefulset <name> --cascade=orphan   # keeps the PVC
  #
  # Narrower attempts were tried and do NOT work — verified against the live
  # controller, each still reporting OutOfSync:
  #   .spec.volumeClaimTemplates[]?.status
  #   .spec.volumeClaimTemplates[].status
  #   /spec/volumeClaimTemplates/0/{status,apiVersion,kind}
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
