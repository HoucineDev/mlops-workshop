# Wave 0 — cert-manager.
#
# KServe's admission/conversion webhooks need serving certificates. cert-manager
# is the only hard dependency of KServe "standard mode"; the Knative and Istio
# stack that KServe Serverless requires is deliberately absent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.17.2
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
          keep: true
        # Single-node kind box: one replica of everything. Requests stay small so
        # the scheduler can fit KServe, the models and LiteLLM alongside, but the
        # LIMITS are deliberately not tight.
        #
        # The original values here capped the controller at 128Mi and cainjector
        # at 128Mi. Both were eventually OOM-killed (exit 137) and sat in
        # CrashLoopBackOff, which stalls wave 0 and therefore every later wave.
        # cert-manager's memory tracks the number of CRDs and Secrets it watches,
        # so it grows with the cluster rather than staying at its startup size.
        replicaCount: 1
        resources:
          requests: { cpu: 10m, memory: 96Mi }
          limits:   { memory: 384Mi }
        webhook:
          replicaCount: 1
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits:   { memory: 192Mi }
        cainjector:
          replicaCount: 1
          # cainjector is the hungriest of the three: it caches every CA bundle
          # it injects, and KServe's CRDs are large.
          resources:
            requests: { cpu: 10m, memory: 128Mi }
            limits:   { memory: 512Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      # cert-manager's CRDs exceed the 262144-byte last-applied-configuration
      # annotation limit that client-side apply uses.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
