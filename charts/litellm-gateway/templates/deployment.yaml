apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "litellm-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the model list changes — LiteLLM reads config.yaml
        # once at startup, so a ConfigMap edit alone is silently ignored.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "litellm-gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "litellm-gateway.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "litellm-gateway.masterKeySecretName" . }}
                  key: {{ .Values.masterKey.existingSecretKey }}
            {{- if .Values.postgresql.enabled }}
            # With DATABASE_URL present the proxy runs its Prisma schema
            # migration at startup and serves the Admin UI at /ui. Without it
            # the API still works, but every UI login fails with
            # "Not connected to DB!".
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:%s@%s-postgresql.%s.svc.cluster.local:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "litellm-gateway.fullname" .) .Release.Namespace .Values.postgresql.auth.database | quote }}
            # The UI signs in with this username and the master key as the
            # password.
            - name: UI_USERNAME
              value: {{ .Values.ui.username | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # /health/liveliness (sic — that is LiteLLM's spelling) is a plain
          # process check. Plain /health would call every upstream model on
          # every probe, which would hammer the KServe predictor.
          # Generous timeouts and failureThresholds on purpose — see the note in
          # postgresql.yaml. A liveness probe that fails because the node is
          # busy restarts a healthy process and makes the node busier.
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            # Generous: on a cold start the proxy waits for postgres, then runs
            # a Prisma migration before it serves anything. 5s x 60 = 5 minutes.
            failureThreshold: {{ .Values.startupProbeFailureThreshold }}
      volumes:
        - name: config
          configMap:
            name: {{ include "litellm-gateway.fullname" . }}-config
