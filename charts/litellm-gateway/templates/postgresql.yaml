{{- if .Values.postgresql.enabled }}
{{- $pgName := printf "%s-postgresql" (include "litellm-gateway.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-gateway.labels" . | nindent 4 }}
  annotations:
    # Must share the StatefulSet's wave. Left at the default 0 it is created
    # AFTER the wave -1 StatefulSet, and the pod dies with
    # CreateContainerConfigError: secret "…-postgresql" not found.
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pgName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-gateway.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "litellm-gateway.postgresqlSelectorLabels" . | nindent 4 }}
---
# A StatefulSet, not a Deployment: the PVC belongs to this one database
# instance, and a StatefulSet's volumeClaimTemplate binds it to the pod's
# identity. A Deployment with a shared PVC would let a rolling update run two
# postgres processes against the same data directory.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $pgName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "litellm-gateway.labels" . | nindent 4 }}
  annotations:
    # The proxy runs its schema migration at startup and crash-loops until the
    # database answers, so bring postgres up first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: {{ $pgName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "litellm-gateway.postgresqlSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litellm-gateway.postgresqlSelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        # The alpine postgres image runs as uid 70. fsGroup makes the
        # local-path volume writable by it without running as root.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ $pgName }}, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $pgName }}, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ $pgName }}, key: database } }
            # The image refuses to initdb into a non-empty mount point, and
            # local-path volumes are not empty (lost+found). A subdirectory
            # sidesteps that.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # timeoutSeconds is explicit and generous. Kubernetes defaults exec and
          # httpGet probes to a 1s timeout, and on a CPU-contended single node
          # that is not enough: pg_isready timed out after 1s, the kubelet
          # killed the container, the restart burned more CPU, and the next
          # probe timed out too. Every platform pod on this node entered that
          # same loop at once — cert-manager, ingress-nginx, argocd-repo-server
          # and litellm all restarted within the same minute, none of them
          # because anything was actually wrong.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.auth.username }}", "-d", "{{ .Values.postgresql.auth.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.auth.username }}", "-d", "{{ .Values.postgresql.auth.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Declared explicitly even though it is the default: the API server
        # fills it in regardless, and a field present in live but absent from
        # Git is a diff ArgoCD reports forever.
        volumeMode: Filesystem
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
